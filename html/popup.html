<html>
  <head>
  </head>
  <link rel="stylesheet" type="text/css" rel="noopener" target="_blank" href="popup.css">
  <body>
    <div class="popup-container">
      <label class="popup-header">Venue Calendar</label>
      <div class="popup-calendar-dropdown">
        <select name="calendars" id="calendar-select">
        </select>
      </div>
      <form id="venue-popup-form">
        <label for="venue_default_venues" class="popup-input-label">Default Venues</label>
          <span class="popup-subtitle">Separate venue names with commas, then click save</span><br>
          <textarea id="venue_default_venues" name="venue_default_venues" rows="4"></textarea><br>
        <label for="venue_enable" class="popup-input-label">Extension Enabled?</label>
          <input id="venue_enable" name="venue_enable" type="checkbox"/> <br>
        <button name="submit" id="save">Save</button>
      </form>
    </div>
  </body>
  <script type="text/javascript" src="../misc/jquery.3.7.1.min.js"></script>
  <script type="text/javascript" src="../src/components/popup.js"></script>
</html>
